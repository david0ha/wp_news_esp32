# The worker.
#
#   docker network create claudepost        # once; the desk joins it too
#   cp agent/.env.example agent/.env        # then fill it in
#   docker compose -f agent/compose.yaml up -d
#
# Its own file rather than a second service in server/compose.yaml, because the
# two halves are deployed differently on purpose. The desk runs wherever the
# tunnel is and holds no credential of the operator's. The worker runs wherever
# the API key already lives -- which may be this machine, a laptop, or a box in
# another country -- and reaches the desk with a producer token. That is the
# same thing an agent on another machine does over the tunnel, so making it a
# separate file is not a convenience: it is the arrangement, written down.
#
# There is no `depends_on` here, and there cannot be: compose files do not
# depend across each other. Nothing is lost. The claim loop's backoff already
# handles a desk that is not up yet, doubling to five minutes and then staying
# there, so a worker started first waits rather than exits.

# A different project name from server/compose.yaml's `claudepost`, on purpose:
# compose removes the containers of a project that are not in the file it was
# given, so sharing a name would make bringing the worker up tear the desk down.
name: claudepost-agent

services:
  agent:
    build:
      # The repository root: the image carries tools/ as well as the loop.
      context: ..
      dockerfile: agent/Dockerfile
    image: claudepost-agent:latest
    restart: unless-stopped
    networks: [claudepost]
    environment:
      # http://desk:8080 is the desk's name on the network below. See
      # agent/.env.example for what to put here when the desk is elsewhere.
      CLAUDEPOST_DESK: ${CLAUDEPOST_DESK:-http://desk:8080}
      # Inside the container the context directory is always /context. Whether
      # anything is *at* /context is the commented volume below, and the worker
      # treats a directory that is not there as no context at all -- which is
      # why this can be unconditional and the mount is the only switch.
      AGENT_CONTEXT_DIR: /context
      AGENT_WRITE_BRIEFS: ${AGENT_WRITE_BRIEFS:-0}
      # Empty means "the image's default allowlist" -- see DEFAULT_TOOLS in
      # agent/loop.py. This is where a market-data MCP goes.
      AGENT_TOOLS: ${AGENT_TOOLS:-}
      CLAUDEPOST_LOG_LEVEL: ${CLAUDEPOST_LOG_LEVEL:-INFO}
      TZ: ${TZ:-UTC}
    volumes:
      # Tokens and the API key. Read-only, and outside the repository, because
      # the repository is public and git history is permanent.
      - ${HOME}/.claudepost:/run/secrets:ro
      # Bring your own continuity. Uncomment this line and set
      # AGENT_CONTEXT_DIR in agent/.env to a directory on THIS machine -- a
      # folder of an Obsidian vault, a git checkout of notes, anything. Nothing
      # in it belongs to this repository, which is why the line is commented
      # rather than defaulted: a default here would be somebody's disk.
      # Read-only: what the worker may write is the briefs, and that is
      # AGENT_WRITE_BRIEFS plus a `:rw` here, both deliberate.
      # - ${AGENT_CONTEXT_DIR}:/context:ro
      #
      # The workdir for one edition: the prompt's output, the tiles, and the
      # proof sheets fetched back to look at. Named rather than a bind mount --
      # it is scratch, it is rebuilt per command, and nobody reads it from the
      # host.
      - claudepost-scratch:/scratch
    security_opt:
      - no-new-privileges:true

volumes:
  claudepost-scratch:

networks:
  # Declared external rather than created here, because the desk joins it from
  # its own side and neither compose file owns the other. Created once, by hand:
  #   docker network create claudepost
  # `external: true` is what makes a missing network fail legibly at `up`
  # instead of silently creating a second, empty one.
  claudepost:
    external: true
