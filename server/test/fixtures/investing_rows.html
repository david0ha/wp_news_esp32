<!--
  A hand-written stand-in for the rows investing.com returns inside the
  {"data": "..."} string of getCalendarFilteredData.

  Every event, figure, time and row id in it is invented, and there is no
  cookie, token, session id or anything else out of a live session: this file
  is committed, and a capture of a real page is a capture of whoever happened
  to be logged in when it was taken.

  It is trimmed to the markup the parser actually reads -- the row's
  data-event-datetime, the seven cells, and the count of grayFullBullishIcon
  in the third of them -- because a fixture carrying markup nothing reads is a
  fixture that fails for reasons unrelated to the parser. Three details in it
  are traps rather than decoration, and each is one the live page contains:

    * the rows are deliberately NOT in chronological order, so the test that
      the events come back ascending asserts on something this file could get
      wrong;
    * the half-filled importance cells say grayEmptyBullishIcon, which
      contains "BullishIcon" and must not be counted -- an importance read
      with the wrong substring is off by exactly the number of empty pips,
      which is to say always wrong and never obviously so;
    * the last row's actual is a non-breaking space rather than an empty
      cell, which is how the live page spells "not published yet".

  This file is the artefact that turns a scraper break into a failing test
  instead of a calendar that quietly goes blank.
-->
